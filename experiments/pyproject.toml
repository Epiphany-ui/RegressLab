[project]
name = "regresslab-preflight"
version = "0.1.0"
description = "Development-only CPU signal preexperiment for RegressLab research v2"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2",
  "threadpoolctl>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
